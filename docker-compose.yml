services:
  stationeers:
    build:
      context: .
      target: runtime
    container_name: stationeers
    restart: unless-stopped

    # Порты (пример)
    ports:
      - "${STATIONEERS_GAME_PORT}:27016/udp"
      - "${STATIONEERS_QUERY_PORT}:27015/udp"

    # Сейвы/логи строго в /data (bind mount)
    volumes:
      - ./data:/data

    # Параметры запуска сервера (используем CLI -file start / -settings)
    command: >
      -nographics -batchmode
      ${STATIONEERS_ARGS}

    # Безопасность
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp

