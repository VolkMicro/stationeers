version: "3.8"

services:
  stationeers:
    build:
      context: .
      target: runtime
    container_name: stationeers
    restart: unless-stopped
    ports:
      - "${STATIONEERS_GAME_PORT}:27016/udp"
      - "${STATIONEERS_QUERY_PORT}:27015/udp"
    volumes:
      - ./data:/data
    command: >
      -nographics -batchmode
      ${STATIONEERS_ARGS}
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
